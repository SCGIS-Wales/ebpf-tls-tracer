apiVersion: v2
name: tls-tracer
description: eBPF-based TLS traffic interceptor for Kubernetes
type: application
# version and appVersion are overridden at publish time by the release
# pipeline (helm package --version X.Y.Z --app-version X.Y.Z) so the chart
