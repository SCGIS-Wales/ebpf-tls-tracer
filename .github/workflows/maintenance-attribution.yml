name: Maintenance - attribution

# One off maintenance after the history rewrite that attributed every commit
# to api-py.
#   retag:    re-point every release tag to its rewritten commit
#             (.github/maintenance/tag-map.txt).
#   releases: delete and recreate every release under api-py's account
#             (.github/maintenance/releases.json), preserving names, notes,
#             pre-release flags and assets. Requires the RELEASE_TOKEN
#             secret (fine grained token of api-py with contents: write);
#             skipped with a notice when the secret is absent.

on:
  # Runs automatically when the maintenance data or this file changes on any
  # branch (workflow_dispatch is only available once the file is on main).
  push:
    branches: ['**']
    paths:
      - .github/maintenance/**
      - .github/workflows/maintenance-attribution.yml
  workflow_dispatch:
    inputs:
      retag:
        description: Re-point release tags to the rewritten commits
        type: boolean
        default: true
      releases:
        description: Recreate releases under api-py (needs RELEASE_TOKEN)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: maintenance-attribution
  cancel-in-progress: false

jobs:
  retag:
    name: Re-point release tags
    if: github.event_name == 'push' || inputs.retag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Force update tags from the map
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          FAILED=0
          while read -r TAG SHA; do
            if [ -z "${TAG}" ] || [ "${TAG#\#}" != "${TAG}" ]; then continue; fi
            CURRENT=$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq .object.sha 2>/dev/null || echo "")
            if [ "${CURRENT}" = "${SHA}" ]; then
              echo "${TAG}: already at ${SHA}"
              continue
            fi
            # 1. REST force update
            if gh api -X PATCH "repos/${REPO}/git/refs/tags/${TAG}" -f sha="${SHA}" -F force=true --jq .object.sha 2>/tmp/err; then
              echo "${TAG}: ${CURRENT:-none} -> ${SHA} (api patch)"
              continue
            fi
            echo "${TAG}: api patch refused: $(tr -d '\n' </tmp/err)"
            # 2. git push with the workflow token
            git tag -f "${TAG}" "${SHA}" >/dev/null
            if git push --force origin "refs/tags/${TAG}" 2>/tmp/err; then
              echo "${TAG}: ${CURRENT:-none} -> ${SHA} (git push)"
              continue
            fi
            echo "${TAG}: git push refused: $(tail -n 3 /tmp/err | tr -d '\n')"
            # 3. REST delete and recreate
            if gh api -X DELETE "repos/${REPO}/git/refs/tags/${TAG}" 2>/tmp/err \
               && gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${SHA}" --jq .object.sha 2>>/tmp/err; then
              echo "${TAG}: ${CURRENT:-none} -> ${SHA} (api delete+create)"
              continue
            fi
            echo "${TAG}: delete+create refused: $(tr -d '\n' </tmp/err)"
            FAILED=$((FAILED + 1))
          done < .github/maintenance/tag-map.txt
          echo "tags still not re-pointed: ${FAILED}"
          [ "${FAILED}" -eq 0 ]

      # The force push of the rewritten main ran the previous pipeline, which
      # auto-tagged a release with no code change. Remove such releases and
      # their tags (.github/maintenance/remove-releases.txt).
      - name: Remove spurious releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          while read -r TAG; do
            if [ -z "${TAG}" ] || [ "${TAG#\#}" != "${TAG}" ]; then continue; fi
            if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
              gh release delete "${TAG}" --repo "${REPO}" --yes && echo "${TAG}: release deleted"
            else
              echo "${TAG}: no release"
            fi
            if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              gh api -X DELETE "repos/${REPO}/git/refs/tags/${TAG}" && echo "${TAG}: tag deleted"
            else
              echo "${TAG}: no tag"
            fi
          done < .github/maintenance/remove-releases.txt

  releases:
    name: Recreate releases under api-py
    if: github.event_name == 'push' || inputs.releases
    needs: [retag]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check RELEASE_TOKEN
        id: token
        env:
          HAS_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          if [ "${HAS_TOKEN}" != "true" ]; then
            echo "::notice::RELEASE_TOKEN secret is not set; releases keep their current author. Add the secret and re-run."
          fi
          echo "present=${HAS_TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Recreate releases
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ME=$(gh api user --jq .login)
          echo "Recreating releases as ${ME}"
          # Every published release, oldest first by semantic version. Any
          # release not owned by api-py is recreated; releases.json only
          # supplies cleaned release notes where the generated ones carried
          # the old assistant branch names.
          gh api --paginate "repos/${REPO}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | [.tag_name, .name, .prerelease, .author.login] | @tsv' \
            | sort -t. -k1,1V > releases.tsv
          LATEST=$(gh api "repos/${REPO}/releases/latest" --jq .tag_name)
          while IFS=$'\t' read -r TAG NAME PRE AUTHOR; do
            if [ "${AUTHOR}" = "${ME}" ]; then
              echo "${TAG}: already owned by ${ME}"
              continue
            fi
            if jq -e --arg t "${TAG}" '.[] | select(.tag_name == $t)' .github/maintenance/releases.json >/dev/null; then
              jq -r --arg t "${TAG}" '.[] | select(.tag_name == $t) | .body' .github/maintenance/releases.json > notes.md
            else
              gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.body // ""' > notes.md
            fi
            rm -rf assets && mkdir -p assets
            gh release download "${TAG}" --repo "${REPO}" --dir assets || true
            gh release delete "${TAG}" --repo "${REPO}" --yes
            ARGS=(--repo "${REPO}" --title "${NAME:-${TAG}}" --notes-file notes.md --verify-tag)
            [ "${PRE}" != "true" ] || ARGS+=(--prerelease)
            if [ "${TAG}" = "${LATEST}" ]; then ARGS+=(--latest); else ARGS+=(--latest=false); fi
            if compgen -G "assets/*" > /dev/null; then
              gh release create "${TAG}" "${ARGS[@]}" assets/*
            else
              gh release create "${TAG}" "${ARGS[@]}"
            fi
            echo "${TAG}: recreated by ${ME} with $(find assets -type f | wc -l) assets"
          done < releases.tsv
