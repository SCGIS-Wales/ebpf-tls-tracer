name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 3'  # Weekly Wednesday 6am UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.179.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Explicit registry rulesets (the "auto" config requires metrics to be
      # on). --error makes the job fail on blocking (ERROR severity) findings
      # so a regression cannot merge silently; every finding is still
      # uploaded to the Security tab as SARIF for triage.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --config p/c \
            --config p/python \
            --config p/dockerfile \
            --config p/github-actions \
            --config p/kubernetes \
            --config p/secrets \
            --metrics=off \
            --sarif --output semgrep.sarif \
            --severity ERROR --error \
            --exclude bin --exclude build

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
