name: Build, Test, and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Release bump to apply when run on main. "auto" derives it from the
          commit messages since the last tag, "none" builds without tagging.
        type: choice
        default: none
        options: [none, auto, patch, minor, major]

# Least privilege by default. Jobs that need more declare it explicitly.
permissions:
  contents: read

# Cancel superseded PR runs. Never cancel a run on main: it may be half-way
# through tagging and publishing a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.14"
  APT_BUILD_DEPS: clang llvm gcc make libbpf-dev libelf-dev zlib1g-dev linux-libc-dev libc6-dev

jobs:
  # ---------- Version resolution ----------
  # Decides the version embedded in every artefact and whether this run
  # produces a release. Semantic bump from Conventional Commits:
  #   feat!: / BREAKING CHANGE  -> major
  #   feat:                     -> minor
  #   anything else             -> patch
  # "[skip release]" in the head commit suppresses tagging.

  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      release: ${{ steps.resolve.outputs.release }}

    steps:
      - name: Checkout repository (full history for tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve next version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REQUESTED_BUMP: ${{ github.event.inputs.release || 'none' }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          CURRENT="${LATEST_TAG#v}"
          [ -n "${CURRENT}" ] || CURRENT="0.0.0"

          BUMP="none"
          if [ "${REF}" = "refs/heads/main" ]; then
            case "${EVENT_NAME}" in
              push) BUMP="auto" ;;
              workflow_dispatch) BUMP="${REQUESTED_BUMP}" ;;
            esac
          fi

          if [ "${BUMP}" = "auto" ]; then
            RANGE="HEAD"
            [ -z "${LATEST_TAG}" ] || RANGE="${LATEST_TAG}..HEAD"
            LOG=$(git log --format='%s%n%b' "${RANGE}")
            if git log -1 --format='%s%n%b' | grep -qiE '\[(skip|no)[ -]release\]'; then
              BUMP="none"
            elif grep -qE '^[A-Za-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:' <<<"${LOG}"; then
              BUMP="major"
            elif grep -qE '^feat(\([^)]*\))?:' <<<"${LOG}"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          fi

          IFS=. read -r MAJOR MINOR PATCH <<<"${CURRENT}"
          PATCH="${PATCH%%-*}"
          case "${BUMP}" in
            major) NEXT="$((MAJOR + 1)).0.0" ;;
            minor) NEXT="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            *)     NEXT="" ;;
          esac

          RELEASE=false
          if [ -n "${NEXT}" ]; then
            if git rev-parse -q --verify "refs/tags/v${NEXT}" >/dev/null; then
              echo "::warning::Tag v${NEXT} already exists, this run will not release"
            else
              RELEASE=true
            fi
          fi

          if [ "${RELEASE}" = "true" ]; then
            VERSION="${NEXT}"
          else
            VERSION="${CURRENT}-dev.$(git rev-parse --short=12 HEAD)"
          fi

          {
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
            echo "previous_tag=${LATEST_TAG}"
            echo "release=${RELEASE}"
          } >> "${GITHUB_OUTPUT}"
          echo "Previous tag: ${LATEST_TAG:-none}; bump: ${BUMP}; version: ${VERSION}; release: ${RELEASE}"

  # ---------- Static checks (fast, fail early) ----------

  lint:
    name: Lint (workflows, Dockerfile, Helm, Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows (actionlint)
        run: |
          docker run --rm -v "${PWD}:/repo" -w /repo \
            rhysd/actionlint:1.7.12 -no-color -pyflakes=

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Lint Helm chart
        run: |
          helm lint helm/tls-tracer --strict
          # Render every optional component to catch template errors early.
          helm template tls-tracer helm/tls-tracer \
            --namespace tls-tracer \
            --kube-version 1.37.0 \
            --set s3.enabled=true --set s3.bucket=example \
            --set kinesis.enabled=true --set kinesis.deliveryStreamName=example \
            --set splunk.enabled=true \
            --set splunk.hecUrl=https://splunk.example/services/collector \
            --set splunk.hecTokenSecret.name=splunk-hec-token \
            --set vpa.enabled=true --set createNamespace=true > /dev/null
          echo "Helm chart renders cleanly"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Lint Python shippers (ruff)
        run: |
          pip install --quiet ruff
          ruff check scripts tests
          ruff format --check scripts tests

  # ---------- Build and test (amd64) ----------

  build:
    name: Build and test (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [version]
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # word splitting of the package list is intended
          sudo apt-get install -y --no-install-recommends ${APT_BUILD_DEPS}

      - name: Audit libbpf version for CVE-2025-29481
        run: |
          echo "=== libbpf version check ==="
          LIBBPF_VER=$(dpkg -l libbpf-dev 2>/dev/null | awk '/^ii/{print $3}' || echo "unknown")
          echo "libbpf-dev version: ${LIBBPF_VER}"
          if echo "${LIBBPF_VER}" | grep -q '^1\.5\.0'; then
            echo "ERROR: libbpf 1.5.0 is vulnerable (CVE-2025-29481)"
            exit 1
          fi
          echo "libbpf version OK"

      - name: Check OpenSSL for CVE-2025-15467
        run: |
          OPENSSL_VER=$(openssl version | awk '{print $2}')
          echo "OpenSSL version: ${OPENSSL_VER}"
          echo "NOTE: CVE-2025-15467 affects OpenSSL 3.0-3.6 (pre-auth RCE via CMS AuthEnvelopedData)."
          echo "The runtime image applies Debian security updates at build time; keep nodes patched too."

      - name: Build
        run: make all

      - name: Run unit tests
        run: make test

      - name: Verify build artifacts
        run: |
          test -f bin/tls_tracer && echo "tls_tracer binary OK"
          test -f bin/bpf_program.o && echo "BPF object OK"
          file bin/tls_tracer
          file bin/bpf_program.o
          # Hardening checks: PIE, full RELRO, non-executable stack, CET
          readelf -hW bin/tls_tracer | grep -q 'Type:.*DYN' && echo "PIE OK"
          readelf -lW bin/tls_tracer | grep -q 'GNU_RELRO' && echo "RELRO OK"
          readelf -lW bin/tls_tracer | grep 'GNU_STACK' | grep -qv 'RWE' && echo "NX stack OK"
          readelf -dW bin/tls_tracer | grep -q 'BIND_NOW' && echo "BIND_NOW OK"

      - name: Smoke test (help and version output)
        run: |
          ./bin/tls_tracer --help
          ./bin/tls_tracer --version | grep -F "${VERSION}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Run Python shipper tests
        run: |
          pip install --quiet -r scripts/requirements.txt
          python3 -m unittest \
            tests.test_s3_shipper \
            tests.test_kinesis_shipper \
            tests.test_splunk_hec_shipper -v

      - name: SonarQube code analysis
        if: vars.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=ebpf-tls-cli
            -Dsonar.sources=src,include,scripts
            -Dsonar.tests=tests
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=**/build/**,**/bin/**,**/__pycache__/**

      - name: Package release artifacts
        run: |
          mkdir -p release
          cp bin/tls_tracer bin/bpf_program.o README.md LICENSE release/
          ARCH=$(uname -m)
          tar -C release -czf "tls_tracer-linux-${ARCH}.tar.gz" .

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tls_tracer-linux-amd64
          path: tls_tracer-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ---------- ARM64 cross-build via QEMU ----------

  build-arm64:
    name: Build and test (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [version]
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Cross-build arm64 binary via Docker
        run: |
          docker run --rm --platform linux/arm64 \
            -e VERSION="${VERSION}" \
            -v "${PWD}:/build" -w /build \
            debian:trixie-slim bash -c '
              apt-get update && apt-get install -y --no-install-recommends \
                clang llvm gcc make libbpf-dev libelf-dev zlib1g-dev \
                linux-libc-dev libc6-dev && \
              make clean && make all && make test
            '

      - name: Package arm64 release artifacts
        run: |
          mkdir -p release
          cp bin/tls_tracer bin/bpf_program.o release/
          cp README.md LICENSE release/
          tar -C release -czf tls_tracer-linux-aarch64.tar.gz .

      - name: Upload arm64 build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tls_tracer-linux-arm64
          path: tls_tracer-linux-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ---------- Functional test on the runner kernel ----------

  functional-test:
    name: Functional test (BPF load)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # word splitting of the package list is intended
          sudo apt-get install -y --no-install-recommends ${APT_BUILD_DEPS} openssl curl

      - name: Build
        run: make all

      - name: Verify kernel eBPF support
        run: |
          echo "=== Kernel version ==="
          uname -r
          echo "=== Architecture ==="
          uname -m
          echo "=== BPF filesystem ==="
          mount | grep bpf || echo "BPF filesystem not mounted (may be auto-mounted)"
          echo "=== BTF support ==="
          ls -la /sys/kernel/btf/vmlinux 2>/dev/null && echo "BTF OK" || echo "BTF not available"
          echo "=== eBPF JIT ==="
          cat /proc/sys/net/core/bpf_jit_enable 2>/dev/null || echo "Cannot read JIT setting"
          echo "=== Kernel config checks ==="
          for cfg in CONFIG_BPF CONFIG_BPF_SYSCALL CONFIG_BPF_JIT CONFIG_UPROBE_EVENTS CONFIG_KPROBE_EVENTS; do
            grep -q "${cfg}=y" "/boot/config-$(uname -r)" 2>/dev/null && echo "$cfg=y OK" || echo "$cfg not found in config (may be built-in)"
          done

      - name: Verify BPF object loads
        run: |
          file bin/bpf_program.o | grep -q "ELF" && echo "BPF object is valid ELF"
          llvm-objdump -h bin/bpf_program.o

      - name: Functional test - SSL library detection
        run: |
          SSL_LIB=$(find /usr/lib* /lib* -name 'libssl.so*' -not -type d 2>/dev/null | head -1)
          if [ -n "$SSL_LIB" ]; then
            echo "Found SSL library: $SSL_LIB"
            timeout 3 sudo ./bin/tls_tracer -l "$SSL_LIB" -v 2>&1 || true
          else
            echo "No SSL library found (expected on minimal CI images)"
          fi

      - name: Functional test - BPF program load and probe attach
        run: |
          cd bin
          timeout 5 sudo ./tls_tracer -v -f json 2>tracer_stderr.log &
          TRACER_PID=$!
          sleep 2

          if kill -0 $TRACER_PID 2>/dev/null; then
            echo "Tracer is running (PID=$TRACER_PID) - BPF loaded successfully"
            curl -s -o /dev/null https://www.google.com 2>/dev/null || true
            sleep 1
            sudo kill -SIGINT $TRACER_PID 2>/dev/null || true
            wait $TRACER_PID 2>/dev/null || true
            echo "=== Tracer stderr output ==="
            cat tracer_stderr.log
            echo "=== Test PASSED: BPF program loaded and probes attached ==="
          else
            echo "=== Tracer stderr output ==="
            cat tracer_stderr.log 2>/dev/null || true
            echo "=== Tracer exited early (may be expected if probes cannot attach in CI) ==="
          fi

  # ---------- Container build and vulnerability gate ----------

  docker-build:
    name: Docker build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [version, build, functional-test]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built once here with the GitHub Actions cache; the integration test
      # and the publish job reuse the cached layers instead of rebuilding.
      - name: Build image (amd64, loaded into the local daemon)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tls_tracer:test
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run --rm tls_tracer:test --help
          docker run --rm tls_tracer:test --version
          # Every shipper sidecar referenced by the Helm chart must be present
          for s in s3_shipper kinesis_shipper splunk_hec_shipper; do
            docker run --rm --entrypoint python3 tls_tracer:test \
              -m py_compile "/opt/tls_tracer/scripts/${s}.py" && echo "${s}.py OK"
          done

      - name: Scan container image (Trivy, human-readable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tls_tracer:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      # Gate: any fixable CRITICAL or HIGH vulnerability fails the build.
      # Unfixed findings are reported above but do not block.
      - name: Scan container image (Trivy, SARIF gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tls_tracer:test
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      - name: Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ---------- Sanitizer build ----------

  sanitizer-build:
    name: Build (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # word splitting of the package list is intended
          sudo apt-get install -y --no-install-recommends ${APT_BUILD_DEPS}

      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          make clean
          make GCC=clang \
            CFLAGS="-O1 -g -Wall -Wextra -Werror -Iinclude -fsanitize=address,undefined -fno-omit-frame-pointer -DVERSION='\"ci-asan\"'" \
            LDFLAGS="-lbpf -lelf -lz -ldl -fsanitize=address,undefined" test

  # ---------- Integration test: K8s with kind ----------

  integration-k8s:
    name: Integration - K8s (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [version, build, docker-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Helm chart supports Kubernetes >=1.34. CI runs the newest kind
      # node image (digest-pinned) so regressions against current Kubernetes
      # surface first. Older kindest/node images ship a glibc older than the
      # Debian trixie build and are incompatible with the host-ssl mounts.
      - name: Create kind cluster (Kubernetes v1.37)
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          version: v0.33.0
          cluster_name: tls-tracer-ci
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          wait: 60s

      - name: Verify Kubernetes version
        run: |
          K8S_VERSION=$(kubectl version -o json | jq -r '.serverVersion.gitVersion')
          echo "Kubernetes version: ${K8S_VERSION}"
          MINOR="${K8S_VERSION#v*.}"
          MINOR="${MINOR%%.*}"
          if [ "${MINOR}" -lt 34 ]; then
            echo "ERROR: Kubernetes version ${K8S_VERSION} is below required v1.34.0"
            exit 1
          fi
          echo "Kubernetes ${K8S_VERSION} meets requirement (>=1.34.0)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build tls_tracer image (from the shared build cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tls_tracer:ci-kind
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha

      - name: Load tls_tracer image into kind
        run: |
          kind load docker-image tls_tracer:ci-kind --name tls-tracer-ci
          echo "tls_tracer image loaded into kind"

      - name: Create apigee namespace with test workload
        run: |
          # Create apigee namespace
          kubectl create namespace apigee
          kubectl label namespace apigee pod-security.kubernetes.io/enforce=privileged

          # Deploy a test pod using debian (shares system libssl with node)
          # This is critical: eBPF uprobes attach per-inode, so the test pod
          # must use the same libssl.so as the node for events to be captured
          kubectl apply -f - <<WORKLOAD
          apiVersion: v1
          kind: Pod
          metadata:
            name: apigee-test-client
            namespace: apigee
            labels:
              app: apigee-test
          spec:
            containers:
              - name: client
                image: debian:trixie-slim
                command: ["sleep", "3600"]
                env:
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: POD_NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
          WORKLOAD

          kubectl wait --for=condition=ready pod/apigee-test-client -n apigee --timeout=120s

          # Install curl and grpcurl inside the debian pod (uses system libssl.so.3)
          kubectl exec -n apigee apigee-test-client -- \
            sh -c "apt-get update -qq && apt-get install -y -qq curl ca-certificates wget > /dev/null 2>&1"

          # Install grpcurl for real gRPC traffic generation
          # shellcheck disable=SC2016 # ${ARCH} is expanded by the pod's shell, not here
          kubectl exec -n apigee apigee-test-client -- \
            sh -c 'ARCH=$(dpkg --print-architecture) && \
                   case "${ARCH}" in amd64) ARCH=x86_64 ;; esac && \
                   wget -q https://github.com/fullstorydev/grpcurl/releases/download/v1.9.4/grpcurl_1.9.4_linux_${ARCH}.tar.gz -O /tmp/grpcurl.tar.gz && \
                   tar -xzf /tmp/grpcurl.tar.gz -C /usr/local/bin grpcurl && \
                   chmod +x /usr/local/bin/grpcurl && \
                   grpcurl --version' 2>/dev/null || echo "grpcurl install: failed (gRPC tests will be skipped)"

          # Install kcat (kafkacat) for real Kafka wire protocol traffic
          kubectl exec -n apigee apigee-test-client -- \
            sh -c 'apt-get install -y -qq kafkacat > /dev/null 2>&1 || \
                   apt-get install -y -qq kcat > /dev/null 2>&1' \
            2>/dev/null || echo "kcat install: failed (Kafka tests will be skipped)"

          echo "apigee test workload is ready (debian with system libssl + grpcurl + kcat)"

      - name: Deploy Kafka broker for protocol testing
        run: |
          # Deploy a single-node Kafka (KRaft mode, no ZooKeeper) for Kafka wire protocol testing
          kubectl create namespace kafka
          kubectl apply -f - <<'KAFKA_DEPLOY'
          apiVersion: v1
          kind: Pod
          metadata:
            name: kafka
            namespace: kafka
            labels:
              app: kafka
          spec:
            containers:
              - name: kafka
                image: apache/kafka:4.3.1
                ports:
                  - containerPort: 9092
                env:
                  - name: KAFKA_NODE_ID
                    value: "1"
                  - name: KAFKA_PROCESS_ROLES
                    value: "broker,controller"
                  - name: KAFKA_LISTENERS
                    value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
                  - name: KAFKA_ADVERTISED_LISTENERS
                    value: "PLAINTEXT://kafka.kafka.svc.cluster.local:9092"
                  - name: KAFKA_CONTROLLER_LISTENER_NAMES
                    value: "CONTROLLER"
                  - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
                    value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
                  - name: KAFKA_CONTROLLER_QUORUM_VOTERS
                    value: "1@localhost:9093"
                  - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
                    value: "1"
                  - name: CLUSTER_ID
                    value: "MkU3OEVBNTcwNTJENDM2Qk"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: kafka
            namespace: kafka
          spec:
            selector:
              app: kafka
            ports:
              - port: 9092
                targetPort: 9092
          KAFKA_DEPLOY

          echo "Waiting for Kafka broker..."
          kubectl wait --for=condition=ready pod/kafka -n kafka --timeout=120s || {
            echo "Kafka pod status:"
            kubectl describe pod/kafka -n kafka
            echo "WARNING: Kafka not ready, Kafka tests will be skipped"
          }
          echo "Kafka broker deployed"

      - name: Deploy tls-tracer DaemonSet
        run: |
          # Create and label namespace before Helm install
          kubectl create namespace tls-tracer || true
          kubectl label namespace tls-tracer pod-security.kubernetes.io/enforce=privileged --overwrite

          # Deploy with --wait=false so we don't block on readiness probe
          # (the health file is written after probe attachment, which may take time in kind)
          helm install tls-tracer helm/tls-tracer \
            --namespace tls-tracer \
            --set image.repository=tls_tracer \
            --set image.tag=ci-kind \
            --set image.pullPolicy=Never \
            --set outputFormat=json \
            --set verbose=true \
            --set 'sanitizePatterns={}' \
            --wait=false

          # Poll for pod to be Running (not gated on readiness probe)
          echo "Waiting for tls-tracer pod to start..."
          for i in $(seq 1 60); do
            PHASE=$(kubectl get pods -n tls-tracer -l app.kubernetes.io/name=tls-tracer \
              -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "Pending")
            if [ "$PHASE" = "Running" ]; then
              echo "tls-tracer pod is Running (attempt $i)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERROR: Pod not running after 120s"
              kubectl describe pods -n tls-tracer -l app.kubernetes.io/name=tls-tracer
              exit 1
            fi
            sleep 2
          done

          # Give the tracer time to attach probes and create health file
          sleep 5

          # Verify the pod hasn't crashed after starting
          RESTART_COUNT=$(kubectl get pods -n tls-tracer -l app.kubernetes.io/name=tls-tracer \
            -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}' 2>/dev/null || echo "0")
          if [ "${RESTART_COUNT}" -gt 0 ]; then
            echo "ERROR: tls-tracer pod crashed (${RESTART_COUNT} restarts)"
            echo "=== Pod description ==="
            kubectl describe pods -n tls-tracer -l app.kubernetes.io/name=tls-tracer
            echo "=== Previous container logs ==="
            kubectl logs -n tls-tracer -l app.kubernetes.io/name=tls-tracer --previous 2>&1 || true
            echo "=== Current container logs ==="
            kubectl logs -n tls-tracer -l app.kubernetes.io/name=tls-tracer 2>&1 || true
            exit 1
          fi

          # Show logs so far
          echo "=== Early tracer logs ==="
          kubectl logs -n tls-tracer -l app.kubernetes.io/name=tls-tracer --tail=20 2>&1 || true
          echo "tls-tracer DaemonSet deployed"

      - name: Generate TLS traffic from apigee namespace
        timeout-minutes: 5
        run: |
          # All curl commands use --connect-timeout 10 --max-time 15 to prevent hangs

          # === HTTP/1.1 requests (explicit --http1.1 flag) ===
          echo "--- HTTP/1.1 traffic ---"
          for i in 1 2 3; do
            kubectl exec -n apigee apigee-test-client -- \
              curl -s -o /dev/null --http1.1 --connect-timeout 10 --max-time 15 \
              -w "HTTP/1.1 GET ${i}: HTTP %{http_code}\n" \
              https://httpbin.org/get 2>/dev/null || echo "HTTP/1.1 GET ${i}: failed (expected in CI)"
            sleep 1
          done

          # HTTP/1.1 POST
          kubectl exec -n apigee apigee-test-client -- \
            curl -s -o /dev/null --http1.1 --connect-timeout 10 --max-time 15 \
            -w "HTTP/1.1 POST: HTTP %{http_code}\n" \
            -X POST -H "Content-Type: application/json" -d '{"test":"data"}' \
            https://httpbin.org/post 2>/dev/null || echo "HTTP/1.1 POST: failed"

          # === HTTP/2 requests ===
          echo "--- HTTP/2 traffic ---"
          for i in 1 2; do
            kubectl exec -n apigee apigee-test-client -- \
              curl -s -o /dev/null --http2 --connect-timeout 10 --max-time 15 \
              -w "HTTP/2 GET ${i}: HTTP %{http_code}\n" \
              https://httpbin.org/get 2>/dev/null || echo "HTTP/2 GET ${i}: failed"
            sleep 1
          done

          # === WebSocket upgrade attempt (we just need the Upgrade header in TLS) ===
          echo "--- WebSocket upgrade attempt ---"
          kubectl exec -n apigee apigee-test-client -- \
            curl -s -o /dev/null --http1.1 --connect-timeout 10 --max-time 15 \
            -w "WS upgrade: HTTP %{http_code}\n" \
            -H "Upgrade: websocket" -H "Connection: Upgrade" \
            -H "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" \
            -H "Sec-WebSocket-Version: 13" \
            https://httpbin.org/get 2>/dev/null || echo "WebSocket: failed (expected)"

          # === Real gRPC traffic via grpcurl ===
          echo "--- gRPC traffic (grpcurl) ---"
          # grpcurl sends real HTTP/2 + protobuf gRPC frames over TLS
          # Use grpcbin reflection service for real gRPC traffic
          kubectl exec -n apigee apigee-test-client -- \
            grpcurl -connect-timeout 10 grpcb.in:443 list \
            2>/dev/null && echo "gRPC list services: OK" || echo "gRPC list: failed (non-critical)"

          kubectl exec -n apigee apigee-test-client -- \
            grpcurl -connect-timeout 10 -d '{"greeting": "test"}' \
            grpcb.in:443 hello.HelloService/SayHello \
            2>/dev/null && echo "gRPC SayHello: OK" || echo "gRPC SayHello: failed (non-critical)"

          # Try gRPC on well-known port 50051 (grpcbin also listens here)
          kubectl exec -n apigee apigee-test-client -- \
            grpcurl -connect-timeout 5 -plaintext grpcb.in:9000 list \
            2>/dev/null && echo "gRPC plaintext: OK" || echo "gRPC plaintext: skipped"

          # === TCP connection error tests ===
          echo "--- TCP connection error tests ---"

          # TCP connection refused: connect to a port with nothing listening
          kubectl exec -n apigee apigee-test-client -- \
            curl -s -o /dev/null --connect-timeout 5 --max-time 10 \
            https://127.0.0.1:19999/should-fail 2>/dev/null \
            && echo "TCP refused: unexpectedly succeeded" \
            || echo "TCP refused: connection refused (expected)"

          # TCP connection timeout: connect to a non-routable IP
          kubectl exec -n apigee apigee-test-client -- \
            curl -s -o /dev/null --connect-timeout 3 --max-time 5 \
            https://192.0.2.1:443/should-timeout 2>/dev/null \
            && echo "TCP timeout: unexpectedly succeeded" \
            || echo "TCP timeout: timed out (expected)"

          # === TLS error tests ===
          echo "--- TLS error tests ---"

          # TLS handshake failure: connect with wrong TLS settings
          # Use a self-signed cert server (the kind node itself on a random port)
          kubectl exec -n apigee apigee-test-client -- \
            curl -s -o /dev/null --connect-timeout 5 --max-time 10 \
            --cacert /dev/null \
            https://httpbin.org:443/get 2>/dev/null \
            || echo "TLS error test: completed (error expected)"

          # TLS certificate verification failure
          kubectl exec -n apigee apigee-test-client -- \
            curl -s -o /dev/null --connect-timeout 5 --max-time 10 \
            https://self-signed.badssl.com/ 2>/dev/null \
            || echo "TLS cert error: verification failed (expected)"

          # TLS expired certificate
          kubectl exec -n apigee apigee-test-client -- \
            curl -s -o /dev/null --connect-timeout 5 --max-time 10 \
            https://expired.badssl.com/ 2>/dev/null \
            || echo "TLS expired cert: failed (expected)"

          # TLS wrong host
          kubectl exec -n apigee apigee-test-client -- \
            curl -s -o /dev/null --connect-timeout 5 --max-time 10 \
            https://wrong.host.badssl.com/ 2>/dev/null \
            || echo "TLS wrong host: failed (expected)"

          # === gRPC error tests via grpcurl ===
          echo "--- gRPC error tests ---"

          # Call a non-existent service to trigger gRPC NOT_FOUND (5) or UNIMPLEMENTED (12)
          kubectl exec -n apigee apigee-test-client -- \
            grpcurl -connect-timeout 10 \
            grpcb.in:443 nonexistent.Service/Method \
            2>/dev/null || echo "gRPC error (UNIMPLEMENTED): captured (expected)"

          # Call with invalid data to trigger INVALID_ARGUMENT (3)
          kubectl exec -n apigee apigee-test-client -- \
            grpcurl -connect-timeout 10 -d '{"invalid_field": true}' \
            grpcb.in:443 hello.HelloService/SayHello \
            2>/dev/null || echo "gRPC invalid arg: captured (expected)"

          # === Kafka wire protocol traffic via kcat ===
          echo "--- Kafka protocol traffic ---"

          # Produce messages to Kafka (real Kafka binary protocol)
          kubectl exec -n apigee apigee-test-client -- \
            sh -c 'echo "test-message-1" | timeout 10 kcat -b kafka.kafka.svc.cluster.local:9092 -P -t test-topic 2>/dev/null || \
                   echo "test-message-1" | timeout 10 kafkacat -b kafka.kafka.svc.cluster.local:9092 -P -t test-topic 2>/dev/null' \
            && echo "Kafka produce: OK" || echo "Kafka produce: failed (non-critical)"

          # List metadata (Metadata API request)
          kubectl exec -n apigee apigee-test-client -- \
            sh -c 'timeout 10 kcat -b kafka.kafka.svc.cluster.local:9092 -L 2>/dev/null || \
                   timeout 10 kafkacat -b kafka.kafka.svc.cluster.local:9092 -L 2>/dev/null' \
            && echo "Kafka metadata: OK" || echo "Kafka metadata: failed (non-critical)"

          # Consume messages (Fetch API request)
          kubectl exec -n apigee apigee-test-client -- \
            sh -c 'timeout 5 kcat -b kafka.kafka.svc.cluster.local:9092 -C -t test-topic -o beginning -c 1 2>/dev/null || \
                   timeout 5 kafkacat -b kafka.kafka.svc.cluster.local:9092 -C -t test-topic -o beginning -c 1 2>/dev/null' \
            && echo "Kafka consume: OK" || echo "Kafka consume: failed (non-critical)"

          # === Node-level traffic (guaranteed to use node's libssl) ===
          echo "--- Node-level traffic ---"
          docker exec tls-tracer-ci-control-plane \
            sh -c "apt-get update -qq && apt-get install -y -qq curl ca-certificates > /dev/null 2>&1 && \
                   curl -s -o /dev/null --connect-timeout 10 --max-time 15 --http1.1 https://httpbin.org/get && echo 'Node HTTP/1.1: OK' && \
                   curl -s -o /dev/null --connect-timeout 10 --max-time 15 --http2 https://httpbin.org/get && echo 'Node HTTP/2: OK'" \
            2>/dev/null || echo "Node traffic: failed (non-critical)"

          # === K8s metadata enrichment test ===
          # Run curl on the kind node with POD_NAME and POD_NAMESPACE env vars set.
          # The tracer reads /proc/<pid>/environ to detect K8s metadata, so processes
          # with these env vars (as set by the K8s downward API) will have k8s_pod
          # and k8s_namespace fields in their JSON events.
          # We use httpbin.org/delay/3 to keep curl alive long enough for the tracer
          # to read /proc/<pid>/environ before the process exits.
          echo "--- K8s metadata enrichment traffic ---"

          # Debug: verify the tls-tracer pod CAN read /proc/<pid>/environ from host PIDs
          TRACER_POD=$(kubectl get pods -n tls-tracer -l app.kubernetes.io/name=tls-tracer \
            -o jsonpath='{.items[0].metadata.name}')
          echo "  Debug: tls-tracer pod = ${TRACER_POD}"
          # Start a long-running process with POD_NAME env var on the kind node
          docker exec -d \
            -e POD_NAME=debug-proc-test \
            -e POD_NAMESPACE=debug-ns \
            tls-tracer-ci-control-plane \
            sleep 60
          sleep 1
          # Find the sleep PID and try to read its environ from the tracer pod
          SLEEP_PID=$(docker exec tls-tracer-ci-control-plane \
            sh -c 'ps aux | grep "sleep 60" | grep -v grep | awk "{print \$2}" | head -1')
          echo "  Debug: sleep PID on node = ${SLEEP_PID}"
          if [ -n "${SLEEP_PID}" ]; then
            kubectl exec -n tls-tracer "${TRACER_POD}" -c tls-tracer -- \
              sh -c "ls -la /proc/${SLEEP_PID}/environ 2>&1; cat /proc/${SLEEP_PID}/environ 2>&1 | tr '\0' '\n' | grep -E 'POD_NAME|POD_NAMESPACE' || echo 'ENVIRON NOT READABLE'" \
              2>&1 || echo "  Debug: kubectl exec failed (readOnlyRootFilesystem may block sh)"
            # Also check from the node directly
            docker exec tls-tracer-ci-control-plane \
              sh -c "cat /proc/${SLEEP_PID}/environ | tr '\0' '\n' | grep -E 'POD_NAME|POD_NAMESPACE'" \
              2>&1 || echo "  Debug: docker exec environ read failed"
          fi

          docker exec \
            -e POD_NAME=k8s-metadata-test \
            -e POD_NAMESPACE=integration-test \
            tls-tracer-ci-control-plane \
            curl -s -o /dev/null --connect-timeout 10 --max-time 15 --http1.1 \
            https://httpbin.org/delay/3 \
            && echo "K8s metadata traffic: OK" \
            || echo "K8s metadata traffic: failed (non-critical)"

          docker exec \
            -e POD_NAME=k8s-metadata-test \
            -e POD_NAMESPACE=integration-test \
            tls-tracer-ci-control-plane \
            curl -s -o /dev/null --connect-timeout 10 --max-time 15 --http1.1 \
            -X POST -d '{"k8s":"test"}' \
            https://httpbin.org/delay/3 \
            && echo "K8s metadata POST: OK" \
            || echo "K8s metadata POST: failed (non-critical)"

          # Give tracer time to capture events
          sleep 10

      - name: Validate tls-tracer JSON logs
        run: |
          set -e
          ERRORS=0

          echo "=== TLS Tracer pod status ==="
          kubectl get pods -n tls-tracer -o wide

          echo ""
          echo "=== TLS Tracer logs (last 200 lines) ==="
          LOGS=$(kubectl logs -n tls-tracer -l app.kubernetes.io/name=tls-tracer --tail=200 2>&1)
          echo "${LOGS}"

          echo ""
          echo "=== TLS Tracer stderr ==="
          kubectl logs -n tls-tracer -l app.kubernetes.io/name=tls-tracer --tail=50 2>&1 || true

          # Check that the tracer pod is running (not CrashLoopBackOff)
          RUNNING=$(kubectl get pods -n tls-tracer -l app.kubernetes.io/name=tls-tracer \
            -o jsonpath='{.items[0].status.phase}')
          CONTAINER_STATE=$(kubectl get pods -n tls-tracer -l app.kubernetes.io/name=tls-tracer \
            -o jsonpath='{.items[0].status.containerStatuses[0].state}' 2>/dev/null || echo "unknown")
          RESTART_COUNT=$(kubectl get pods -n tls-tracer -l app.kubernetes.io/name=tls-tracer \
            -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}' 2>/dev/null || echo "0")
          echo "Pod phase: ${RUNNING}, container state: ${CONTAINER_STATE}, restarts: ${RESTART_COUNT}"

          if [ "${RESTART_COUNT}" -gt 0 ]; then
            echo "ERROR: Tracer pod has restarted ${RESTART_COUNT} times (CrashLoopBackOff)"
            kubectl describe pods -n tls-tracer -l app.kubernetes.io/name=tls-tracer
            kubectl logs -n tls-tracer -l app.kubernetes.io/name=tls-tracer --previous 2>&1 || true
            ERRORS=$((ERRORS + 1))
          elif [ "${RUNNING}" = "Running" ]; then
            echo "TLS tracer pod is running"
          else
            echo "ERROR: TLS tracer pod is not running (status: ${RUNNING})"
            kubectl describe pods -n tls-tracer -l app.kubernetes.io/name=tls-tracer
            ERRORS=$((ERRORS + 1))
          fi

          # Check for JSON output
          JSON_LINES=$(echo "${LOGS}" | grep '^{' | head -10 || true)
          if [ -n "${JSON_LINES}" ]; then
            echo ""
            echo "=== Captured JSON events ==="
            echo "${JSON_LINES}"

            # Validate JSON structure
            FIRST_LINE=$(echo "${JSON_LINES}" | head -1)
            if echo "${FIRST_LINE}" | python3 -m json.tool > /dev/null 2>&1; then
              echo "JSON output is valid"
            else
              echo "ERROR: JSON output is not valid JSON"
              ERRORS=$((ERRORS + 1))
            fi

            # Check for expected fields (required)
            for field in timestamp pid comm direction dst_ip dst_port data_len transport protocol tls_auth; do
              if echo "${FIRST_LINE}" | grep -q "\"${field}\""; then
                echo "Field '${field}' present in JSON"
              else
                echo "WARNING: Field '${field}' missing from JSON"
              fi
            done

            # Check for enriched fields (best-effort — may not appear on every event)
            echo ""
            echo "=== Checking enriched fields across all events ==="
            for field in src_ip src_port dst_dns http_version tls_version tls_cipher tls_auth http_method http_path http_host user_agent host_ip k8s_pod k8s_namespace container_id; do
              if echo "${JSON_LINES}" | grep -q "\"${field}\""; then
                echo "Enriched field '${field}' found in events"
              else
                echo "Note: '${field}' not present (may not apply to captured traffic)"
              fi
            done

            # Validate src_ip is populated (not "-") in at least one event
            SRC_IP_POPULATED=$(echo "${JSON_LINES}" | grep '"src_ip"' | grep -v '"src_ip":"-"' | head -1 || true)
            if [ -n "${SRC_IP_POPULATED}" ]; then
              echo "PASS: src_ip is populated with actual IP address"
            else
              echo "WARNING: src_ip shows '-' in all events (tcp_set_state may not have fired)"
            fi

            # Check for TCP error events
            echo ""
            echo "=== Checking error event types ==="
            ALL_LOGS=$(kubectl logs -n tls-tracer -l app.kubernetes.io/name=tls-tracer --tail=1000 2>&1)
            ALL_JSON=$(echo "${ALL_LOGS}" | grep '^{' || true)

            TCP_ERRORS=$(echo "${ALL_JSON}" | grep '"event_type":"tcp_error"' | head -5 || true)
            if [ -n "${TCP_ERRORS}" ]; then
              echo "PASS: TCP error events captured:"
              echo "${TCP_ERRORS}" | head -3
            else
              echo "Note: No TCP error events captured (connect errors may not be visible)"
            fi

            TLS_ERRORS=$(echo "${ALL_JSON}" | grep '"event_type":"tls_error"' | head -5 || true)
            if [ -n "${TLS_ERRORS}" ]; then
              echo "PASS: TLS error events captured:"
              echo "${TLS_ERRORS}" | head -3
            else
              echo "Note: No TLS error events captured (SSL errors may not be visible)"
            fi

            # Check for gRPC status codes
            GRPC_STATUS=$(echo "${ALL_JSON}" | grep '"grpc_status"' | head -3 || true)
            if [ -n "${GRPC_STATUS}" ]; then
              echo "PASS: gRPC status codes captured:"
              echo "${GRPC_STATUS}" | head -3
            else
              echo "Note: No gRPC status codes captured (grpc-status header may not appear in captured data)"
            fi

            # Check for WebSocket close codes
            WS_CLOSE=$(echo "${ALL_JSON}" | grep '"ws_close_code"' | head -3 || true)
            if [ -n "${WS_CLOSE}" ]; then
              echo "PASS: WebSocket close codes captured:"
              echo "${WS_CLOSE}" | head -3
            else
              echo "Note: No WebSocket close codes captured (no close frames in test traffic)"
            fi

            # Check for QUIC detection events
            QUIC_EVENTS=$(echo "${ALL_JSON}" | grep '"quic_detected"' | head -3 || true)
            if [ -n "${QUIC_EVENTS}" ]; then
              echo "PASS: QUIC detection events captured:"
              echo "${QUIC_EVENTS}" | head -3
            else
              echo "Note: No QUIC events captured (no QUIC traffic in test)"
            fi

            # Check for TLS cipher suite
            CIPHER_EVENTS=$(echo "${ALL_JSON}" | grep '"tls_cipher"' | head -3 || true)
            if [ -n "${CIPHER_EVENTS}" ]; then
              echo "PASS: TLS cipher suite captured:"
              echo "${CIPHER_EVENTS}" | head -3
            else
              echo "Note: No TLS cipher suite captured (SSL_get_current_cipher may not have been called)"
            fi

            # Check for TLS auth mode (one-way vs mTLS)
            TLS_AUTH=$(echo "${ALL_JSON}" | grep '"tls_auth"' | head -3 || true)
            if [ -n "${TLS_AUTH}" ]; then
              echo "PASS: TLS auth mode present in events:"
              echo "${TLS_AUTH}" | head -3
            else
              echo "Note: No tls_auth field found"
            fi

            # Check for User-Agent
            UA_EVENTS=$(echo "${ALL_JSON}" | grep '"user_agent"' | head -3 || true)
            if [ -n "${UA_EVENTS}" ]; then
              echo "PASS: User-Agent captured:"
              echo "${UA_EVENTS}" | head -3
            else
              echo "Note: No User-Agent captured"
            fi

            # Check for host_ip (EC2/node IP enrichment)
            HOST_IP_EVENTS=$(echo "${ALL_JSON}" | grep '"host_ip"' | head -3 || true)
            if [ -n "${HOST_IP_EVENTS}" ]; then
              echo "PASS: host_ip field present (node/EC2 IP enrichment working):"
              echo "${HOST_IP_EVENTS}" | head -1 | python3 -c "import sys,json; e=json.load(sys.stdin); print(f'  host_ip={e[\"host_ip\"]}')" 2>/dev/null || true
            else
              echo "Note: No host_ip field (HOST_IP env var not set or no non-loopback interface found)"
            fi

            # Check for K8s metadata enrichment (pod name, namespace, container ID)
            echo ""
            echo "=== Checking K8s metadata enrichment ==="
            # The K8s metadata test generates traffic from processes with POD_NAME and
            # POD_NAMESPACE env vars set (simulating K8s downward API). The tracer reads
            # /proc/<pid>/environ to detect these.
            K8S_POD=$(echo "${ALL_JSON}" | grep '"k8s_pod"' | head -5 || true)
            if [ -n "${K8S_POD}" ]; then
              echo "PASS: k8s_pod field present (pod name detected from /proc/<pid>/environ):"
              echo "${K8S_POD}" | head -1 | python3 -c "import sys,json; e=json.load(sys.stdin); print(f'  k8s_pod={e.get(\"k8s_pod\",\"-\")}, k8s_namespace={e.get(\"k8s_namespace\",\"-\")}')" 2>/dev/null || true
              if echo "${K8S_POD}" | grep -q 'k8s-metadata-test'; then
                echo "PASS: k8s_pod contains expected 'k8s-metadata-test' from enrichment test"
              else
                echo "Note: k8s_pod present but 'k8s-metadata-test' not found (may have different pod name)"
              fi
            else
              echo "Note: No k8s_pod field found — /proc/<pid>/environ may not be readable from the DaemonSet container"
              echo "  This is expected in kind where procfs access may be restricted across namespaces"
            fi

            K8S_NS=$(echo "${ALL_JSON}" | grep '"k8s_namespace"' | head -5 || true)
            if [ -n "${K8S_NS}" ]; then
              echo "PASS: k8s_namespace field present"
              if echo "${K8S_NS}" | grep -q 'integration-test'; then
                echo "PASS: k8s_namespace contains expected 'integration-test'"
              fi
            else
              echo "Note: No k8s_namespace field"
            fi

            CONTAINER_ID=$(echo "${ALL_JSON}" | grep '"container_id"' | head -5 || true)
            if [ -n "${CONTAINER_ID}" ]; then
              echo "PASS: container_id field present (detected from /proc/<pid>/cgroup):"
              echo "${CONTAINER_ID}" | head -1 | python3 -c "import sys,json; e=json.load(sys.stdin); print(f'  container_id={e.get(\"container_id\",\"-\")}')" 2>/dev/null || true
            else
              echo "Note: No container_id field (cgroup format may not match expected patterns in kind)"
            fi

            # Check for Kafka protocol detection
            KAFKA_EVENTS=$(echo "${ALL_JSON}" | grep '"kafka"' | head -3 || true)
            if [ -n "${KAFKA_EVENTS}" ]; then
              echo "PASS: Kafka protocol events captured:"
              echo "${KAFKA_EVENTS}" | head -3
            else
              echo "Note: No Kafka events captured (no Kafka traffic in test)"
            fi

            # Summary of all detected JSON field types
            echo ""
            echo "=== Complete field inventory across all events ==="
            echo "${ALL_JSON}" | head -50 | grep -oP '"[a-z_]+":' | sort -u | sed 's/[":]*//g; s/^/  - /' || echo "  (field extraction unavailable)"
          else
            echo ""
            echo "ERROR: No JSON events captured"
            echo "The tracer must capture at least one TLS event during integration testing."
            echo "Check if the tracer is running, if libssl path is correct, or if the pod crashed."
            ERRORS=$((ERRORS + 1))
          fi

          echo ""
          if [ "${ERRORS}" -gt 0 ]; then
            echo "FAILED: ${ERRORS} error(s) detected"
            exit 1
          fi
          echo "Integration test passed: tls-tracer deployed and running on K8s"


  # ---------- Tag release on main ----------
  # Runs only when every build, test, scan and integration job is green on
  # main. The tag is annotated so `git describe` and the GitHub UI show the
  # release metadata.

  auto-tag:
    name: Tag release
    if: needs.version.outputs.release == 'true'
    needs: [version, lint, build, build-arm64, sanitizer-build, functional-test, docker-build, integration-k8s]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.version }}
      previous_tag: ${{ needs.version.outputs.previous_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create and push annotated tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::notice::Tag ${TAG} already exists, nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"
          echo "::notice::Created tag ${TAG}"

  # ---------- GitHub Release with signed provenance ----------

  github-release:
    name: GitHub release
    needs: [auto-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.auto-tag.outputs.tag }}
          persist-credentials: false

      - name: Download amd64 build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tls_tracer-linux-amd64

      - name: Download arm64 build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tls_tracer-linux-arm64

      - name: Create checksums
        run: sha256sum tls_tracer-linux-*.tar.gz | tee checksums.txt

      # SLSA build provenance: consumers verify with
      #   gh attestation verify tls_tracer-linux-x86_64.tar.gz --repo SCGIS-Wales/ebpf-tls-tracer
      - name: Attest build provenance for release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: tls_tracer-linux-*.tar.gz

      - name: Compose release notes header
        env:
          TAG: ${{ needs.auto-tag.outputs.tag }}
          VERSION: ${{ needs.auto-tag.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          OWNER="${REPO%%/*}"
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "# Container image (multi-arch, provenance and SBOM attached)"
            echo "docker pull ${IMAGE}:${VERSION}"
            echo
            echo "# Helm chart"
            echo "helm install tls-tracer oci://${REGISTRY}/${OWNER,,}/charts/tls-tracer \\"
            echo "  --version ${VERSION} --namespace tls-tracer --create-namespace"
            echo
            echo "# Static binaries"
            echo "curl -LO https://github.com/${REPO}/releases/download/${TAG}/tls_tracer-linux-x86_64.tar.gz"
            echo "gh attestation verify tls_tracer-linux-x86_64.tar.gz --repo ${REPO}"
            echo '```'
            echo
            echo "## Checksums (SHA-256)"
            echo
            echo '```'
            cat checksums.txt
            echo '```'
            echo
          } > release-notes-header.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.auto-tag.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.auto-tag.outputs.previous_tag }}
        run: |
          set -euo pipefail
          NOTES_ARGS=(--generate-notes --notes-file release-notes-header.md)
          [ -z "${PREVIOUS_TAG}" ] || NOTES_ARGS+=(--notes-start-tag "${PREVIOUS_TAG}")

          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists, refreshing assets..."
            gh release edit "${TAG}" --latest
            gh release upload "${TAG}" --clobber tls_tracer-linux-*.tar.gz checksums.txt
          else
            echo "Creating release ${TAG}..."
            gh release create "${TAG}" \
              --title "${TAG}" \
              --verify-tag \
              --latest \
              "${NOTES_ARGS[@]}" \
              tls_tracer-linux-*.tar.gz checksums.txt
          fi

  # ---------- Publish container to GHCR ----------

  publish-container:
    name: Publish container
    needs: [auto-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.auto-tag.outputs.tag }}
          persist-credentials: false

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.auto-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.auto-tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.auto-tag.outputs.tag }}
            type=raw,value=latest

      - name: Build and push multi-arch container image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ needs.auto-tag.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "${GITHUB_OUTPUT}"

      # Signed provenance in the registry: consumers verify with
      #   gh attestation verify oci://ghcr.io/scgis-wales/ebpf-tls-tracer:<tag> --repo SCGIS-Wales/ebpf-tls-tracer
      - name: Attest container image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ---------- Publish Helm chart to GHCR (OCI) ----------

  publish-helm-chart:
    name: Publish Helm chart
    needs: [auto-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.auto-tag.outputs.tag }}
          persist-credentials: false

      - name: Package and push chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.auto-tag.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          helm registry login "${REGISTRY}" --username "${ACTOR}" --password-stdin <<< "${GH_TOKEN}"
          helm package helm/tls-tracer \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination dist
          helm push "dist/tls-tracer-${VERSION}.tgz" "oci://${REGISTRY}/${OWNER,,}/charts"
          echo "::notice::Published oci://${REGISTRY}/${OWNER,,}/charts/tls-tracer:${VERSION}"
